version: 2

project_name: rumpty-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: rumpty
    main: .
    binary: rumpty
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/cloverworks-hq/rumpty-cli/internal/version.Version={{ .Version }}
      - -X github.com/cloverworks-hq/rumpty-cli/internal/version.Commit={{ .Commit }}
      - -X github.com/cloverworks-hq/rumpty-cli/internal/config.DefaultAPIURL=https://api.rumptycloud.com
      - -X github.com/cloverworks-hq/rumpty-cli/internal/version.Date={{ .Date }}

archives:
  - id: rumpty
    ids:
      - rumpty
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  extra_files:
    - glob: ./install.sh

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: cloverworks-hq
    name: rumpty-cli
  draft: false
  prerelease: auto
  extra_files:
    - glob: ./install.sh
