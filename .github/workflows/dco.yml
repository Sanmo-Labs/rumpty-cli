name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            case "$author" in *"[bot]"*) continue ;; esac
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qxF "$author"; then
              echo "::error::$(git log -1 --format='%h %s' "$c") is missing 'Signed-off-by: $author'"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off your commits with 'git commit -s'. To fix existing ones: git rebase --signoff origin/master && git push --force-with-lease"
            exit 1
          fi
